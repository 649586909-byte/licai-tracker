<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>理财记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#f2f3f7;--card:#fff;--line:#eceef2;--txt:#1a1a1a;--sub:#8a8f99;
--up:#e23b3b;--down:#17a06a;--brand:#3a5bd9;--brand2:#eef1fd}
html,body{background:var(--bg);color:var(--txt);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:88px;max-width:640px;margin:0 auto}
.hd{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 16px 8px}
.hd h1{font-size:20px;font-weight:700}
.hd .sum{font-size:12px;color:var(--sub);margin-top:3px}
.filters{display:flex;gap:8px;padding:8px 16px 4px;flex-wrap:wrap;align-items:center}
.filters select{flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--line);
border-radius:10px;background:#fff;font-size:14px;color:var(--txt)}
.segs{display:flex;gap:6px;padding:6px 16px 10px;overflow-x:auto}
.seg{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);
background:#fff;font-size:13px;color:var(--sub)}
.seg.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.sec-title{font-size:13px;color:var(--sub);padding:10px 18px 6px}
.list{padding:0 12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:8px 4px;
box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card .name{font-size:16px;font-weight:600;line-height:1.3}
.bank{display:inline-block;font-size:11px;color:var(--brand);background:var(--brand2);
padding:2px 8px;border-radius:6px;margin-bottom:5px}
.meta{font-size:12px;color:var(--sub);margin-top:6px}
.rates{display:flex;gap:18px;margin-top:10px;align-items:flex-end}
.rate .lab{font-size:11px;color:var(--sub)}
.rate .val{font-size:22px;font-weight:700;line-height:1.1;margin-top:2px}
.rate.small .val{font-size:15px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.na{color:var(--sub)}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:40px 20px}
.redeemed .card{opacity:.72}
.tag-redeem{font-size:11px;color:var(--sub);border:1px solid var(--line);
padding:2px 7px;border-radius:6px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:20;
background:var(--brand);color:#fff;border:none;font-size:15px;font-weight:600;
padding:14px 26px;border-radius:999px;box-shadow:0 6px 18px rgba(58,91,217,.4)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;
align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;
padding:18px 18px 28px;max-height:88vh;overflow:auto}
.sheet h3{font-size:17px;margin-bottom:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;color:var(--sub);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:11px 12px;border:1px solid var(--line);
border-radius:10px;font-size:15px;background:#fff;color:var(--txt)}
.row2{display:flex;gap:10px}.row2>*{flex:1}
.btns{display:flex;gap:10px;margin-top:8px}
.btn{flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600}
.btn.pri{background:var(--brand);color:#fff}
.btn.sec{background:#f0f1f5;color:var(--txt)}
.btn.danger{background:#fde8e8;color:var(--up)}
.snaps{margin:4px 0 14px}
.snap{display:flex;justify-content:space-between;align-items:center;font-size:14px;
padding:9px 2px;border-bottom:1px solid var(--line)}
.snap .del{color:var(--up);font-size:12px;background:none;border:none;padding:4px 6px}
.detail-meta{font-size:13px;color:var(--sub);margin-bottom:12px;line-height:1.7}
.detail-meta b{color:var(--txt);font-weight:600}
.linkbtn{background:none;border:none;color:var(--brand);font-size:13px;padding:0}
.hint{font-size:12px;color:var(--sub);margin:-4px 0 12px}
</style>
</head>
<body>
<div class="hd">
  <h1>理财记录</h1>
  <div class="sum" id="summary">暂无数据</div>
</div>
<div class="filters">
  <select id="bankFilter"><option value="">全部银行</option></select>
  <button id="dataBtn" style="flex:0 0 auto;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--brand)">导入/导出</button>
</div>
<div class="segs" id="segs">
  <div class="seg on" data-p="week">近一周年化</div>
  <div class="seg" data-p="month">按月(近30天)</div>
  <div class="seg" data-p="year">按年(近365天)</div>
  <div class="seg" data-p="cum">累计年化</div>
</div>

<div id="activeList" class="list"></div>

<div id="redeemedWrap" style="display:none">
  <div class="sec-title">已赎回</div>
  <div id="redeemedList" class="list redeemed"></div>
</div>

<button class="fab" id="addBtn">+ 新增理财</button>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>

<script>
const KEY='licai_records_v1';
const DAY=86400000;
let state=load();
let period='week';     // week | month | year | cum
let bankSel='';

function load(){
  try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return []}
}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function uid(){return 'p'+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}
function today(){return new Date().toISOString().slice(0,10)}
function parseD(s){return new Date(s+'T00:00:00').getTime()}
function daysBetween(a,b){return Math.max(1,Math.round((parseD(b)-parseD(a))/DAY))}
function fmtNum(n){return Number(n).toLocaleString('zh-CN',{maximumFractionDigits:2})}

// 买入记录（兼容旧的单笔 purchaseDate/principal）
function buysOf(p){
  const bs=(p.buys&&p.buys.length)?p.buys.slice()
    :(p.purchaseDate!=null?[{date:p.purchaseDate,amount:Number(p.principal)}]:[]);
  return bs.sort((a,b)=>parseD(a.date)-parseD(b.date));
}
function firstBuyDate(p){const bs=buysOf(p);return bs.length?bs[0].date:today();}
function totalPrincipal(p){return buysOf(p).reduce((s,b)=>s+Number(b.amount),0);}
function principalAsOf(p,dateStr){
  return buysOf(p).reduce((s,b)=>parseD(b.date)<=parseD(dateStr)?s+Number(b.amount):s,0);
}
// 本金×天数（元·天）：每笔本金按各自投入到 uptoDate 的天数加权
function capitalDays(p,uptoDate){
  return buysOf(p).reduce((s,b)=>parseD(b.date)<=parseD(uptoDate)
    ? s+Number(b.amount)*daysBetween(b.date,uptoDate):s,0);
}

// 持仓收益数据点：首次买入日(收益0) + 各条「持仓收益」记录，按日期升序
function points(p){
  const prin=totalPrincipal(p);
  const pts=[{date:firstBuyDate(p),profit:0}]
    .concat((p.snapshots||[]).map(s=>({date:s.date,
      profit:s.profit!=null?Number(s.profit):Number(s.amount)-prin})));
  pts.sort((x,y)=>parseD(x.date)-parseD(y.date));
  return pts;
}
function endDate(p){
  const pts=points(p);const last=pts[pts.length-1].date;
  return p.status==='redeemed'&&p.redeemDate?p.redeemDate:last;
}
function latestProfit(p){const pts=points(p);return pts[pts.length-1].profit}

// 累计年化：按每笔本金的实际投入天数加权（元·天），收益=最新持仓收益
function cumYield(p){
  const pts=points(p);const last=pts[pts.length-1];
  if(pts.length<2)return null;
  const cd=capitalDays(p,last.date);
  if(cd<=0)return null;
  return last.profit/cd*365*100;
}
// 区间收益：取与「winDays天前」最接近的收益点作锚点。
// 要求锚点离目标日期不超过 winDays 天，否则视为「近期数据不足」返回 null，
// 避免只有一条记录时近一周/一月/一年算出同一个数。
function windowGain(p,winDays){
  const pts=points(p);const last=pts[pts.length-1];
  if(pts.length<2)return null;
  const target=parseD(last.date)-winDays*DAY;
  let anchor=pts[0],best=Infinity;
  for(let i=0;i<pts.length-1;i++){
    const dist=Math.abs(parseD(pts[i].date)-target);
    if(dist<best){best=dist;anchor=pts[i];}
  }
  if(anchor.date===last.date)return null;
  if(best>winDays*DAY)return null;              // 锚点离目标太远 → 数据不足
  return {money:last.profit-anchor.profit,days:daysBetween(anchor.date,last.date),
          from:anchor.date,to:last.date};
}
// 区间年化：用区间收益 / 当前总本金 折算
function winYield(p,winDays){
  const g=windowGain(p,winDays);if(!g)return null;
  const base=principalAsOf(p,g.to);if(base<=0)return null;
  return g.money/base*365/g.days*100;
}
// 最近一笔区间：最新两条数据点之间的收益（偶尔记一次时，这就是最能反映近况的指标）
function lastGain(p){
  const pts=points(p);if(pts.length<2)return null;
  const a=pts[pts.length-2],b=pts[pts.length-1];
  return {money:b.profit-a.profit,days:daysBetween(a.date,b.date),from:a.date,to:b.date};
}
function lastYield(p){
  const g=lastGain(p);if(!g)return null;
  const base=principalAsOf(p,g.to);if(base<=0)return null;
  return g.money/base*365/g.days*100;
}
function yieldOf(p,per){
  if(per==='cum')return cumYield(p);
  return winYield(p,per==='week'?7:per==='month'?30:365);
}
function rateHtml(v,cls){
  if(v===null||isNaN(v))return '<span class="na">—</span>';
  const sign=v>=0?'+':'';
  return '<span class="'+(v>=0?'up':'down')+'">'+sign+v.toFixed(2)+'%</span>';
}
const PLAB={week:'近一周年化',month:'近一月年化',year:'近一年年化',cum:'累计年化'};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function profitHtml(v){
  const cls=v>=0?'up':'down';return '<span class="'+cls+'">'+(v>=0?'+':'')+fmtNum(v)+'</span>';
}
function moneyHtml(v){return '<span class="'+(v>=0?'up':'down')+'">'+(v>=0?'+':'')+fmtNum(v)+' 元</span>';}

// 持仓收益走势迷你图（SVG）：斜率/弯曲即可看出近期变好变坏
function sparkline(p){
  const pts=points(p);if(pts.length<2)return '';
  const xs=pts.map(pt=>parseD(pt.date)),ys=pts.map(pt=>pt.profit);
  const x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs);
  const y0=Math.min.apply(0,ys),y1=Math.max.apply(0,ys);
  const W=300,H=46,pad=4;
  const sx=x=>x1===x0?W/2:pad+(x-x0)/(x1-x0)*(W-2*pad);
  const sy=y=>y1===y0?H/2:H-pad-(y-y0)/(y1-y0)*(H-2*pad);
  const d=pts.map((pt,i)=>(i?'L':'M')+sx(xs[i]).toFixed(1)+' '+sy(ys[i]).toFixed(1)).join(' ');
  const col=ys[ys.length-1]>=ys[0]?'var(--up)':'var(--down)';
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '
    +'style="width:100%;height:46px;display:block">'
    +'<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" '
    +'stroke-linejoin="round" stroke-linecap="round"/></svg>';
}
// 近期趋势块：走势图 + 近7天/近30天实际赚的钱 + 日均（按日历天数，含0收益的日子）
function trendHtml(p){
  const sl=sparkline(p);
  if(!sl)return '<div class="hint" style="margin-bottom:12px">记满两条以上「持仓收益」才能看出近期走势。</div>';
  const g7=windowGain(p,7),g30=windowGain(p,30);
  const cell=(lab,g)=>'<div style="flex:1"><div style="font-size:11px;color:var(--sub)">'+lab+'</div>'
    +'<div style="font-size:15px;font-weight:600">'+(g?moneyHtml(g.money):'<span class="na">需补录</span>')+'</div>'
    +(g?'<div style="font-size:11px;color:var(--sub)">'+g.days+'天·日均 '+moneyHtml(g.money/g.days)+'</div>':'')+'</div>';
  return '<div style="background:#fafbfe;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px">'
    +'<div style="font-size:12px;color:var(--sub);margin-bottom:4px">持仓收益走势</div>'+sl
    +'<div style="display:flex;gap:12px;margin-top:8px">'+cell('近7天收益',g7)+cell('近30天收益',g30)+'</div></div>';
}
function cardHtml(p){
  const prim=yieldOf(p,period);
  const cum=cumYield(p);
  const days=daysBetween(firstBuyDate(p),endDate(p));
  const nbuy=buysOf(p).length;
  const primLab=period==='cum'?'累计年化':PLAB[period];
  let second='';
  if(period!=='cum'){
    second='<div class="rate small"><div class="lab">累计年化</div>'
      +'<div class="val">'+rateHtml(cum)+'</div></div>';
  }
  const g7=windowGain(p,7);
  const wl='<div class="rate small"><div class="lab">近7天收益'+(g7?'('+g7.days+'天)':'')+'</div><div class="val">'
    +(g7?moneyHtml(g7.money):'<span class="na">需补录</span>')+'</div></div>';
  const redeemTag=p.status==='redeemed'?'<span class="tag-redeem">已赎回</span>':'';
  const buyTxt=nbuy>1?('首次 '+esc(firstBuyDate(p))+'·'+nbuy+'笔'):('购买 '+esc(firstBuyDate(p)));
  return '<div class="card" data-id="'+p.id+'">'
    +'<div class="top"><div><span class="bank">'+esc(p.bank||'未填银行')+'</span>'
    +'<div class="name">'+esc(p.name)+'</div></div>'+redeemTag+'</div>'
    +'<div class="meta">'+buyTxt+' · 持有 '+days+' 天 · 本金 '+fmtNum(totalPrincipal(p))
    +' · 持仓收益 '+profitHtml(latestProfit(p))+'</div>'
    +sparkline(p)
    +'<div class="rates"><div class="rate"><div class="lab">'+primLab+'</div>'
    +'<div class="val">'+rateHtml(prim)+'</div></div>'+second+wl+'</div></div>';
}

function sortByPeriod(arr){
  return arr.slice().sort((a,b)=>{
    const va=yieldOf(a,period),vb=yieldOf(b,period);
    if(va===null&&vb===null)return 0;
    if(va===null)return 1; if(vb===null)return -1;
    return vb-va;              // 降序，低收益沉底
  });
}
function render(){
  // 银行下拉
  const banks=[...new Set(state.map(p=>p.bank).filter(Boolean))];
  const bf=document.getElementById('bankFilter');
  bf.innerHTML='<option value="">全部银行</option>'
    +banks.map(b=>'<option value="'+esc(b)+'"'+(b===bankSel?' selected':'')+'>'+esc(b)+'</option>').join('');

  let items=state.filter(p=>!bankSel||p.bank===bankSel);
  const active=sortByPeriod(items.filter(p=>p.status!=='redeemed'));
  const redeemed=items.filter(p=>p.status==='redeemed');

  const al=document.getElementById('activeList');
  al.innerHTML=active.length?active.map(cardHtml).join('')
    :'<div class="empty">还没有持有中的理财，点下方按钮新增。</div>';

  const rw=document.getElementById('redeemedWrap');
  if(redeemed.length){rw.style.display='';
    document.getElementById('redeemedList').innerHTML=sortByPeriod(redeemed).map(cardHtml).join('');
  }else rw.style.display='none';

  // 汇总
  const totalPrin=active.reduce((s,p)=>s+totalPrincipal(p),0);
  const totalProfit=active.reduce((s,p)=>s+latestProfit(p),0);
  document.getElementById('summary').innerHTML= state.length
    ? '持有 '+active.length+' 支 · 本金 '+fmtNum(totalPrin)
      +' · 持仓收益 <span class="'+(totalProfit>=0?'up':'down')+'">'
      +(totalProfit>=0?'+':'')+fmtNum(totalProfit)+'</span>'
    : '暂无数据';
}
const mask=document.getElementById('mask'),sheet=document.getElementById('sheet');
function openSheet(html){sheet.innerHTML=html;mask.classList.add('on')}
function closeSheet(){mask.classList.remove('on');sheet.innerHTML=''}
mask.addEventListener('click',e=>{if(e.target===mask)closeSheet()});

// 新增 / 编辑产品
function buyRowHtml(date,amount){
  return '<div class="buyrow" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:10px">'
    +'<div class="fld" style="flex:1;margin:0"><label>买入时间</label><input class="b_date" type="date" value="'+(date||today())+'"></div>'
    +'<div class="fld" style="flex:1;margin:0"><label>本金(元)</label><input class="b_amt" type="number" inputmode="decimal" placeholder="10000" value="'+(amount!=null?amount:'')+'"></div>'
    +'<button type="button" onclick="this.closest(\'.buyrow\').remove()" style="flex:0 0 auto;background:#f0f1f5;border:none;border-radius:10px;width:40px;height:42px;font-size:18px;color:#999">×</button></div>';
}
function addBuyRow(){document.getElementById('buyRows').insertAdjacentHTML('beforeend',buyRowHtml())}
function collectBuys(){
  const buys=[];
  document.querySelectorAll('#buyRows .buyrow').forEach(r=>{
    const d=r.querySelector('.b_date').value,a=parseFloat(r.querySelector('.b_amt').value);
    if(d&&!isNaN(a)&&a>0)buys.push({date:d,amount:a});
  });
  return buys;
}
function productForm(p){
  const e=p||{};
  const head='<div class="fld"><label>银行</label><input id="f_bank" placeholder="如 招商银行" value="'+esc(e.bank||'')+'"></div>'
    +'<div class="fld"><label>理财名字</label><input id="f_name" placeholder="如 招银理财稳健90天" value="'+esc(e.name||'')+'"></div>';
  if(p){
    openSheet('<h3>编辑理财</h3>'+head
      +'<div class="hint">买入记录和持仓收益在详情页管理。</div>'
      +'<div class="btns"><button class="btn sec" onclick="closeSheet()">取消</button>'
      +'<button class="btn pri" onclick="saveProduct(\''+p.id+'\')">保存</button></div>');
    return;
  }
  openSheet('<h3>新增理财</h3>'+head
    +'<label style="font-size:13px;color:var(--sub);display:block;margin:2px 0 6px">买入记录（可多笔加仓）</label>'
    +'<div id="buyRows">'+buyRowHtml()+'</div>'
    +'<button type="button" class="linkbtn" style="margin-bottom:14px" onclick="addBuyRow()">+ 再加一笔买入</button>'
    +'<div class="row2"><div class="fld"><label>当前持仓收益(选填)</label><input id="f_val" type="number" inputmode="decimal" placeholder="已赚多少，可为负"></div>'
    +'<div class="fld"><label>收益计算时间</label><input id="f_vdate" type="date" value="'+today()+'"></div></div>'
    +'<div class="hint">持仓收益是整个产品所有买入的合计收益；填了才能算年化。</div>'
    +'<div class="btns"><button class="btn sec" onclick="closeSheet()">取消</button>'
    +'<button class="btn pri" onclick="saveProduct(\'\')">保存</button></div>');
}
function saveProduct(id){
  const bank=val('f_bank').trim(),name=val('f_name').trim();
  if(!name){alert('请填理财名字');return}
  if(id){
    const p=state.find(x=>x.id===id);p.bank=bank;p.name=name;
    save();closeSheet();render();return;
  }
  const buys=collectBuys();
  if(!buys.length){alert('请至少填一笔有效买入（时间+本金）');return}
  const p={id:uid(),bank,name,buys,snapshots:[],status:'active'};
  const v=parseFloat(val('f_val')),vd=val('f_vdate');
  if(!isNaN(v)&&vd)p.snapshots.push({date:vd,profit:v});
  state.push(p);save();closeSheet();render();
}
function val(id){const el=document.getElementById(id);return el?el.value:''}
// 产品详情：快照管理 / 追加 / 赎回 / 编辑 / 删除
function detail(id){
  const p=state.find(x=>x.id===id);if(!p)return;
  const prin=totalPrincipal(p);
  const days=daysBetween(firstBuyDate(p),endDate(p));
  const buys=buysOf(p);
  const buyHtml=buys.map(b=>
    '<div class="snap"><span>'+esc(b.date)+'</span>'
    +'<span>'+fmtNum(b.amount)+' 元 '
    +'<button class="del" onclick="delBuy(\''+p.id+'\',\''+b.date+'\','+Number(b.amount)+')">删除</button></span></div>'
  ).join('');
  const snaps=(p.snapshots||[]).slice().sort((a,b)=>parseD(b.date)-parseD(a.date));
  const snapHtml=snaps.length?snaps.map(s=>{
    const pf=s.profit!=null?Number(s.profit):Number(s.amount)-prin;
    const dy=s.daily!=null?' <span style="font-size:11px;color:var(--sub)">当日 '+(s.daily>=0?'+':'')+fmtNum(s.daily)+'</span>':'';
    return '<div class="snap"><span>'+esc(s.date)+dy+'</span>'
    +'<span>累计 '+profitHtml(pf)+' '
    +'<button class="del" onclick="delSnap(\''+p.id+'\',\''+s.date+'\')">删除</button></span></div>';
  }).join(''):'<div class="hint">还没有收益记录，记一笔才能算年化。</div>';
  openSheet(
    '<h3>'+esc(p.name)+'</h3>'
    +'<div class="detail-meta"><b>'+esc(p.bank||'未填银行')+'</b> · 首次买入 '+esc(firstBuyDate(p))
    +' · 持有 <b>'+days+'</b> 天<br>本金合计 <b>'+fmtNum(prin)+'</b>（'+buys.length+' 笔）· 持仓收益 '+profitHtml(latestProfit(p))+'<br>'
    +'近一周年化 '+rateHtml(winYield(p,7))+' · 累计年化 '+rateHtml(cumYield(p))+'</div>'
    +trendHtml(p)
    +'<div class="fld"><label>买入记录（可多次加仓）</label><div class="snaps">'+buyHtml+'</div></div>'
    +'<div class="buyrow" style="display:flex;gap:8px;align-items:flex-end;margin-bottom:14px">'
    +'<div class="fld" style="flex:1;margin:0"><label>买入时间</label><input id="nb_date" type="date" value="'+today()+'"></div>'
    +'<div class="fld" style="flex:1;margin:0"><label>本金</label><input id="nb_amt" type="number" inputmode="decimal" placeholder="加仓金额"></div>'
    +'<button class="btn pri" style="flex:0 0 auto;width:64px;padding:11px 0" onclick="addBuy(\''+p.id+'\')">加仓</button></div>'
    +'<div class="fld"><label>持仓收益记录（偶尔记一下当前总收益即可）</label><div class="snaps">'+snapHtml+'</div></div>'
    +'<div class="row2"><div class="fld"><label>当前持仓收益(可为负)</label><input id="s_val" type="number" inputmode="decimal" placeholder="至今合计赚了多少"></div>'
    +'<div class="fld"><label>日期</label><input id="s_date" type="date" value="'+today()+'"></div></div>'
    +'<button class="btn pri" style="width:100%;margin-bottom:14px" onclick="addSnap(\''+p.id+'\')">记录持仓收益</button>'
    +'<div class="btns">'
    +'<button class="btn sec" onclick="productForm(getP(\''+p.id+'\'))">编辑银行/名字</button>'
    +(p.status==='redeemed'
       ?'<button class="btn sec" onclick="unredeem(\''+p.id+'\')">撤销赎回</button>'
       :'<button class="btn sec" onclick="redeem(\''+p.id+'\')">赎回</button>')
    +'</div>'
    +'<div class="btns"><button class="btn danger" onclick="delProduct(\''+p.id+'\')">删除该理财</button></div>'
  );
}
function ensureBuys(p){
  if(!(p.buys&&p.buys.length))p.buys=buysOf(p);
  delete p.purchaseDate;delete p.principal;return p.buys;
}
function addBuy(id){
  const p=getP(id);const d=val('nb_date'),a=parseFloat(val('nb_amt'));
  if(!d){alert('请选买入时间');return}
  if(isNaN(a)||a<=0){alert('请填有效本金');return}
  ensureBuys(p).push({date:d,amount:a});
  save();detail(id);render();
}
function delBuy(id,date,amount){
  const p=getP(id);const bs=ensureBuys(p);
  if(bs.length<=1){alert('至少保留一笔买入；要清掉整个产品请用“删除该理财”');return}
  const i=bs.findIndex(b=>b.date===date&&Number(b.amount)===Number(amount));
  if(i>=0)bs.splice(i,1);
  save();detail(id);render();
}
function getP(id){return state.find(x=>x.id===id)}
// 重算每条记录的累计持仓收益：按日期升序走一遍，
// 当日收益(daily)在上一条累计基础上累加；持仓累计(profit)为该日权威值并重置基准。
function recalc(p){
  const prin=totalPrincipal(p);
  const arr=(p.snapshots||[]).slice().sort((a,b)=>parseD(a.date)-parseD(b.date));
  let run=0;
  for(const s of arr){
    if(s.daily!=null){run+=Number(s.daily);s.profit=run;}
    else{run=(s.profit!=null?Number(s.profit):Number(s.amount)-prin);s.profit=run;delete s.amount;}
  }
  p.snapshots=arr;
}
function addSnap(id){
  const p=getP(id);const v=parseFloat(val('s_val')),d=val('s_date');
  if(isNaN(v)){alert('请填持仓累计收益(可为负)');return}
  if(!d){alert('请选日期');return}
  p.snapshots=(p.snapshots||[]).filter(s=>s.date!==d);
  p.snapshots.push({date:d,profit:v});
  recalc(p);save();detail(id);render();
}
function addDaily(id){
  const p=getP(id);const g=parseFloat(val('s_val')),d=val('s_date');
  if(isNaN(g)){alert('请填当日收益(可为负)');return}
  if(!d){alert('请选日期');return}
  p.snapshots=(p.snapshots||[]).filter(s=>s.date!==d);
  p.snapshots.push({date:d,daily:g});
  recalc(p);save();detail(id);render();
}
function delSnap(id,date){
  const p=getP(id);p.snapshots=(p.snapshots||[]).filter(s=>s.date!==date);
  recalc(p);save();detail(id);render();
}
function redeem(id){
  const p=getP(id);
  const d=prompt('赎回日期(YYYY-MM-DD)',today());if(!d)return;
  p.status='redeemed';p.redeemDate=d;save();closeSheet();render();
}
function unredeem(id){const p=getP(id);p.status='active';delete p.redeemDate;save();closeSheet();render();}
function delProduct(id){
  if(!confirm('确定删除该理财及其所有记录？不可恢复。'))return;
  state=state.filter(x=>x.id!==id);save();closeSheet();render();
}

// 导入 / 导出
function openData(){
  const cur=JSON.stringify(state,null,2);
  openSheet(
    '<h3>导入 / 导出数据</h3>'
    +'<div class="hint">数据只存在本机浏览器。导出可做备份或换设备迁移；导入可粘贴一段 JSON。</div>'
    +'<div class="fld"><label>当前数据（可复制备份）</label>'
    +'<textarea id="d_out" readonly style="width:100%;height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:monospace">'+esc(cur)+'</textarea></div>'
    +'<button class="btn sec" style="width:100%;margin-bottom:14px" onclick="copyOut()">复制上面内容</button>'
    +'<div class="fld"><label>粘贴要导入的 JSON</label>'
    +'<textarea id="d_in" placeholder="在此粘贴" style="width:100%;height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;font-family:monospace"></textarea></div>'
    +'<div class="btns"><button class="btn sec" onclick="doImport(\'merge\')">追加导入</button>'
    +'<button class="btn pri" onclick="doImport(\'replace\')">替换导入</button></div>'
    +'<div class="btns"><button class="btn sec" onclick="closeSheet()">关闭</button></div>'
  );
}
function copyOut(){
  const t=document.getElementById('d_out');t.select();
  try{document.execCommand('copy');alert('已复制');}catch(e){alert('请手动长按复制');}
}
function doImport(mode){
  let arr;
  try{arr=JSON.parse(document.getElementById('d_in').value);}catch(e){alert('不是合法 JSON：'+e.message);return;}
  if(!Array.isArray(arr)){alert('顶层必须是数组 []');return;}
  const clean=arr.filter(p=>p&&p.name).map(p=>{
    const o={id:p.id||uid(),bank:p.bank||'',name:p.name,
      buys:Array.isArray(p.buys)?p.buys:(p.purchaseDate?[{date:p.purchaseDate,amount:Number(p.principal)}]:[]),
      snapshots:Array.isArray(p.snapshots)?p.snapshots:[],status:p.status==='redeemed'?'redeemed':'active'};
    if(p.redeemDate)o.redeemDate=p.redeemDate;
    recalc(o);return o;
  });
  if(!clean.length){alert('没解析到有效产品');return;}
  if(mode==='replace'){
    if(!confirm('替换导入会清空现有 '+state.length+' 条，用导入的 '+clean.length+' 条覆盖，确定？'))return;
    state=clean;
  }else{
    const ids=new Set(state.map(x=>x.id));
    clean.forEach(p=>{if(ids.has(p.id))p.id=uid();state.push(p);});
  }
  save();closeSheet();render();
  alert('导入成功：共 '+state.length+' 条');
}

// 事件
document.getElementById('addBtn').addEventListener('click',()=>productForm(null));
document.getElementById('dataBtn').addEventListener('click',openData);
document.getElementById('bankFilter').addEventListener('change',e=>{bankSel=e.target.value;render()});
document.getElementById('segs').addEventListener('click',e=>{
  const s=e.target.closest('.seg');if(!s)return;
  period=s.dataset.p;
  document.querySelectorAll('.seg').forEach(x=>x.classList.toggle('on',x===s));
  render();
});
document.addEventListener('click',e=>{
  const c=e.target.closest('.card');
  if(c&&!mask.classList.contains('on'))detail(c.dataset.id);
});

render();

</script>
